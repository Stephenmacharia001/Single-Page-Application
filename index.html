<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordly Dictionary</title>
    <!-- FIXED: Fully qualified, correct Bootstrap  link to prevent connection timeouts -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Target alignment frame layer -->
    <div class="app-container">
        
        <!-- Header and theme switcher -->
        <header class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <h1 class="m-0">Wordly</h1>
                <p class="subtitle">An interactive dictionary application</p>
            </div>
            <button id="themeToggle" aria-label="Toggle dark and light mode">
                <!-- Emojis inside custom CSS button rules serve as visual anchors -->
                🌓 Dark & Light Theme
            </button>
        </header>

        <!-- Search form panel -->
        <section class="card-panel">
            <form id="searchForm" novalidate>
                <div class="flex-grow-1">
                    <input type="text" id="searchInput" class="w-100" 
                           placeholder="Type a word to learn..." aria-label="Dictionary search input" required autocomplete="off">
                    <div class="invalid-feedback validation-message d-none">Please enter a valid word to search.</div>
                </div>
                <button type="submit">Search</button>
            </form>
        </section>

        <!-- Favorites / Saved words -->
        <section id="favoritesWrapper" class="card-panel d-none">
            <h3>Saved Vocabulary</h3>
            <div id="favoritesList">
                <!-- Saved items will appear here dynamically via JavaScript -->
            </div>
        </section>

        <!-- Feedback and response display node -->
        <main id="resultContainer" class="card-panel">
            <div class="text-center text-muted py-4">
                <p class="m-0 fs-5">Enter a word here to search</p>
            </div>
        </main>
    </div>

    <!-- UI component templates -->
    <template id="template-loading">
        <div class="text-center py-4">
            <!-- Uses the optimized custom keyframe spinning element from the CSS -->
            <div class="spinner-loader" role="status"></div>
            <p class="mt-3 text-muted mb-0">Consulting Wordly Language Tools...</p>
        </div>
    </template>

    <template id="template-error">
        <div class="alert alert-danger p-4 border-0 d-flex align-items-center" role="alert" style="border-radius: var(--radius-lg);">
            <div class="fs-3 me-3">⚠️</div>
            <div>
                <h5 class="alert-heading fw-bold mb-1">Word Not Found</h5>
                <p class="mb-0 small JSON-error-msg">We couldn't track down definitions for that term. Double-check your spelling or try another query.</p>
            </div>
        </div>
    </template>

    <template id="template-word-result">
        <div>
            <!-- Custom operational result bindings mapping -->
            <div class="word-result-header">
                <div>
                    <h2 id="res-word" class="m-0"></h2>
                    <span id="res-phonetic" class="phonetic-text"></span>
                </div>
                <div class="action-buttons-group">
                    <button id="audioBtn" class="btn-icon d-none" aria-label="Play pronunciation audio">
                        🔊
                    </button>
                    <button id="favBtn" class="btn-icon btn-outline-warning" aria-label="Save word to favorites">
                        ⭐
                    </button>
                </div>
            </div>
            
            <div id="meaningsContainer"></div>
            
            <div class="source-attribution">
                Source Details: <a id="res-source" href="#" target="_blank"></a>
            </div>
        </div>
    </template>

    <!-- Core application logic link -->
    <script src="app.js"></script>
</body>
</html>
